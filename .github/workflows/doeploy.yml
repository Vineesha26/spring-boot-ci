name: Docker -> build -> push -> deploy

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Setup Java
      uses: actions/setup-java@v5.2.0

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '21'

    - name: Build Jar
      run: ./mvnw clean package -DskipTests

    - name: Login to Docker Hub
      run: docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      
    - name: Build the Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-boot-cloudb:latest

    - name: Push the Docker image to Docker Hub
      run: docker push -${{ secrets.DOCKER_USERNAME }}/spring-boot-cloudb:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
            host: ${{secrets.EC2_HOST}}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker stop spring-b || true
              docker rm spring-b || true
              docker pull ${{ secrets.DOCKER_USERNAME }}/spring-boot-cloudb:latest
              docker run -d --name spring-b -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/spring-boot-cloudb:latest
    

      
