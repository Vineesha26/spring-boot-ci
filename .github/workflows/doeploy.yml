name: Docker -> build -> push -> deploy

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Set up Java
      uses: actions/setup-java@v5.2.0
      with:
        distribution: 'temurin'       
        java-version: '21'           

    - name: Build Jar
      run: ./mvnw clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
            
    - name: Build the Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-cloudb:latest .

    - name: Push the Docker image to Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-cloudb:latest

    - name: Prepare SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ github.workspace }}/ec2_key.pem
        script: |
          docker stop spring-b || true
          docker rm spring-b || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-cloudb:latest
          docker run -d --name spring-b -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-cloudb:latest
